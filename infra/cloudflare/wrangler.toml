name = "bbr-auth-proxy"
main = "auth-proxy-worker.js"
compatibility_date = "2026-09-27"

# ── Manual step, dashboard/DNS only — cannot be done from this file ──
# auth.bluebeaconresearch.com must exist as a DNS record in the Cloudflare
# zone for bluebeaconresearch.com before a route can bind to it. Once that
# zone/record exists, uncomment and deploy:

routes = [
  { pattern = "auth.bluebeaconresearch.com", custom_domain = true }
]

# See docs/brain/12_DEPLOYMENT.md §6 for the full manual checklist
# (DNS record, Google Cloud Console OAuth redirect URI, Supabase Auth
# redirect allowlist).

[vars]
SUPABASE_ORIGIN = "evavcgfmemwryggdkjmx.supabase.co"
ALLOWED_ORIGINS = "https://bluebeaconresearch.com,https://www.bluebeaconresearch.com"
ALLOWED_ORIGIN_PATTERN = "^https://bluebeaconresearch-[a-z0-9]+-kashif-nehals-projects\\.vercel\\.app$"