name: Redis integration tests

on:
  workflow_dispatch:

jobs:
  redis-integration:
    runs-on: ubuntu-latest
    if: secrets.REDIS_URL != ''
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install deps
        run: pnpm install
      - name: Run Redis token-bucket integration test
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node apps/web/scripts/test_redis_rate_limiter.js
      - name: Call ratelimit health endpoint
        env:
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
        run: |
          if [ -n "$NEXT_PUBLIC_BASE_URL" ]; then curl -sS "$NEXT_PUBLIC_BASE_URL/api/ratelimit/health" | jq . || true; else echo "No NEXT_PUBLIC_BASE_URL provided"; fi
