<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_auth" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-bright": "#393939", "surface-tint": "#4edea3", "on-background": "#e5e2e1", "on-secondary": "#0b3900", "secondary": "#72df4d", "on-surface-variant": "#bbcac0", "primary-container": "#4edea3", "on-primary-fixed": "#002114", "inverse-surface": "#e5e2e1", "error-container": "#93000a", "on-tertiary-fixed": "#410004", "tertiary": "#ffdad7", "surface-container-low": "#1c1b1b", "primary-fixed": "#6ffbbe", "on-tertiary-container": "#8e3432", "tertiary-fixed": "#ffdad7", "surface-container-high": "#2a2a2a", "background": "#131313", "primary": "#6ffbbe", "surface-container": "#201f1f", "on-error-container": "#ffdad6", "on-primary-fixed-variant": "#005236", "primary-fixed-dim": "#4edea3", "outline-variant": "#3c4a42", "on-primary-container": "#005f40", "on-primary": "#003824", "on-secondary-container": "#093100", "tertiary-fixed-dim": "#ffb3ae", "on-surface": "#e5e2e1", "secondary-fixed": "#8efc67", "tertiary-container": "#ffb3ad", "on-error": "#690005", "on-secondary-fixed": "#042100", "inverse-primary": "#006c4a", "secondary-fixed-dim": "#72df4d", "inverse-on-surface": "#313030", "surface-dim": "#131313", "on-secondary-fixed-variant": "#145200", "surface": "#131313", "surface-variant": "#353534", "error": "#ffb4ab", "surface-container-highest": "#353534", "on-tertiary": "#611213", "outline": "#86948a", "on-tertiary-fixed-variant": "#7f2927", "secondary-container": "#3ba615", "surface-container-lowest": "#0e0e0e" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, spacing: {}, fontFamily: { "headline": ["Inter"], "display": ["Inter"], "body": ["Inter"], "label": ["Space Grotesk"] } } } }</script></head><body class="bg-surface font-body text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl"><div class="h-14 px-3 flex items-center justify-between"><button aria-label="Navigate Back" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><div class="flex items-center gap-2"><div class="w-6 h-6 rounded bg-surface-container-high flex items-center justify-center"><span class="font-label font-bold text-primary text-xs">B</span></div><span class="font-label font-bold text-xs uppercase tracking-widest text-on-surface">Login</span></div><div class="w-11 h-11 flex items-center justify-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-14 bg-surface px-4"><div class="flex flex-col w-full items-center justify-center py-4">
<!-- Tactical Intelligence Modal Shell -->
<div class="w-full max-w-[420px] bg-surface-container rounded-xl p-6 sm:p-7 relative overflow-hidden shadow-2xl transition-all duration-300">
<!-- Top Emerald Status Ribbon Indicator -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-primary/20 via-primary to-primary/20"></div>
<!-- Brand Identity Block -->
<div class="flex flex-col items-center justify-center text-center mt-2 mb-6">
<div class="w-12 h-12 rounded-lg bg-surface-container-high flex items-center justify-center mb-3 text-primary shadow-[0_0_15px_rgba(78,222,163,0.12)]">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
<path d="M12 8v4"></path>
<path d="M12 16h.01"></path>
</svg>
</div>
<h2 class="font-label font-bold text-xs tracking-[0.2em] text-on-surface uppercase select-none">
        Blue Beacon Research
      </h2>
<h1 class="text-2xl font-bold tracking-tight text-on-surface mt-4 mb-1">
        Welcome back
      </h1>
<p class="font-label text-[10px] tracking-widest uppercase text-on-surface-variant/80 font-medium">
        Sign in to your intelligence feed
      </p>
</div>
<!-- Verified Email Flash Confirmation Ribbon -->
<div class="mb-5 flex items-center justify-center gap-2 py-2 px-3 bg-surface-container-high rounded-lg transition-opacity duration-300" id="statusNotification">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
<span class="text-[11px] text-primary-fixed-dim font-medium tracking-tight">Your email is confirmed — sign in to continue.</span>
</div>
<!-- SSO Action Rail -->
<button class="w-full h-12 bg-surface-container-high hover:bg-surface-bright active:scale-[0.99] rounded-lg flex items-center justify-center gap-3 transition-all duration-150" type="button">
<!-- High fidelity Google mark -->
<svg class="w-4 h-4" fill="none" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="text-xs font-medium tracking-wide text-on-surface">Continue with Google</span>
</button>
<!-- Visual Asymmetric Divider -->
<div class="relative my-5 flex items-center justify-center">
<div class="w-full h-px bg-surface-bright/40"></div>
<span class="absolute bg-surface-container px-3 font-label text-[10px] uppercase tracking-widest text-on-surface-variant/70 font-semibold">
        or
      </span>
</div>
<!-- Credentials Authentication Form -->
<form class="flex flex-col gap-4" id="loginForm" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Email Component -->
<div class="flex flex-col gap-1.5">
<label class="font-label text-[10px] tracking-widest uppercase text-on-surface-variant font-bold" for="terminalEmail">
          Email
        </label>
<div class="relative bg-surface-container-lowest rounded-lg focus-within:ring-1 focus-within:ring-primary/40 transition-all">
<input class="w-full h-11 bg-transparent px-3 font-mono text-xs text-on-surface placeholder:text-on-surface-variant/40 outline-none border-none" id="terminalEmail" placeholder="you@example.com" required="" type="email" value="alex.vance@blackmesa.mil"/>
</div>
</div>
<!-- Password Component -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label text-[10px] tracking-widest uppercase text-on-surface-variant font-bold" for="terminalPassword">
            Password
          </label>
<a class="font-label text-[10px] tracking-wider uppercase text-primary hover:text-primary-fixed transition-colors font-semibold" href="#reset">
            Forgot Password?
          </a>
</div>
<div class="relative bg-surface-container-lowest rounded-lg flex items-center focus-within:ring-1 focus-within:ring-primary/40 transition-all">
<input class="w-full h-11 bg-transparent pl-3 pr-10 font-mono text-xs text-on-surface placeholder:text-on-surface-variant/40 outline-none border-none" id="terminalPassword" placeholder="••••••••" required="" type="password" value="secureNodeAuth2025!"/>
<button aria-label="Toggle password visibility" class="absolute right-2 text-on-surface-variant hover:text-on-surface p-1 transition-colors flex items-center justify-center" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action CTA -->
<button class="mt-2 w-full h-12 bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold text-xs uppercase tracking-wider rounded-lg flex items-center justify-center gap-2 transition-transform active:scale-[0.98] shadow-[0_0_20px_rgba(78,222,163,0.18)] hover:shadow-[0_0_25px_rgba(78,222,163,0.28)]" id="signInSubmit" type="submit">
<span id="btnText">Sign In</span>
<span class="material-symbols-outlined text-[16px]" id="btnIcon">arrow_forward</span>
</button>
</form>
<!-- Sign-up Redirection -->
<div class="mt-5 text-center">
<p class="text-xs text-on-surface-variant font-medium">
        Don't have an account? 
        <a class="text-primary hover:underline font-semibold ml-1 inline-flex items-center" href="#signup">
          Sign up
        </a>
</p>
</div>
<!-- Node Operational Status Ribbon -->
<div class="mt-6 pt-4 flex items-center justify-center gap-2 bg-surface-container-lowest/60 rounded py-2 px-3">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-pulse"></span>
<span class="font-mono text-[9px] uppercase tracking-[0.15em] text-on-surface-variant">
        SECURE NODE: BB-ALPHA-09 • V4.22.0
      </span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('terminalPassword');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function triggerAuth() {
    const btn = document.getElementById('signInSubmit');
    const text = document.getElementById('btnText');
    const icon = document.getElementById('btnIcon');
    
    text.textContent = 'AUTHENTICATING...';
    icon.textContent = 'sync';
    icon.classList.add('animate-spin');
    btn.disabled = true;
    btn.classList.add('opacity-80');

    setTimeout(() => {
      text.textContent = 'VERIFIED';
      icon.classList.remove('animate-spin');
      icon.textContent = 'check_circle';
      setTimeout(() => {
        text.textContent = 'Sign In';
        icon.textContent = 'arrow_forward';
        btn.disabled = false;
        btn.classList.remove('opacity-80');
      }, 1500);
    }, 1000);
  }
</script></main><footer class="fixed bottom-0 w-full z-40 pb-safe bg-surface/90 backdrop-blur-xl"><div class="h-10 px-4 flex items-center justify-center gap-2 text-center"><span class="w-1.5 h-1.5 rounded-full bg-primary"></span><span class="font-mono text-[10px] tracking-wider uppercase text-on-surface-variant">BB-ALPHA-09 • V4.22.0</span></div></footer></body></html>
