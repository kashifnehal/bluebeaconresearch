<div class="absolute bottom-0 left-0 right-0 h-[1px] bg-surface-bright"></div>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label text-[10px] font-bold uppercase tracking-widest text-on-surface-variant" for="reg-email">Email</label>

<input class="w-full h-11 px-3.5 bg-transparent font-mono text-sm text-on-surface placeholder:text-outline-variant focus:outline-none focus:text-primary transition-colors" id="reg-email" placeholder="you@example.com" type="email"/>

<div class="relative bg-surface-container-lowest rounded">
<input class="w-full h-11 pl-3.5 pr-11 bg-transparent font-mono text-sm text-on-surface placeholder:text-outline-variant focus:outline-none focus:text-primary transition-colors" id="reg-password" placeholder="Enter secure key" type="password" value="tactical-alpha-24"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-11 w-11 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors" id="pwd-toggle" type="button">
<span class="material-symbols-outlined text-[19px]" id="pwd-icon">visibility</span>

<div class="pt-2 flex flex-col gap-1.5">

<div class="h-1 rounded-full bg-primary transition-all duration-300" id="bar-3"></div>

</div>
<div class="flex justify-between items-center text-[10px] font-mono">
<span class="text-on-surface-variant uppercase tracking-wider">Entropy Score</span>
<span class="text-primary font-bold" id="entropy-label">HIGH (78%)</span>
</div>
</div>
</div>
<button class="w-full h-12 mt-2 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-sm tracking-wider uppercase rounded shadow-lg shadow-primary/10 hover:shadow-primary/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 group" type="submit">

<span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>

        Already have an account?

</p>
<div class="flex items-center gap-2 pt-2 text-[10px] font-mono tracking-widest text-on-surface-variant/80 uppercase">
<span>SECURE NODE: BB-ALPHA-09</span>
<span class="w-1 h-1 rounded-full bg-primary/60"></span>
<span>V4.22.0</span>
</div>
</div>
</div>
</div>
<script>
  (function initTacticalAuth() {
    const pwdInput = document.getElementById('reg-password');
    const pwdToggle = document.getElementById('pwd-toggle');
    const pwdIcon = document.getElementById('pwd-icon');
    const bar4 = document.getElementById('bar-4');
    const entropyLabel = document.getElementById('entropy-label');

    if (pwdToggle && pwdInput && pwdIcon) {
      pwdToggle.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });

      pwdInput.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length >= 16) {
          bar4.className = 'h-1 rounded-full bg-primary transition-all duration-300';
          entropyLabel.textContent = 'MAXIMAL (96%)';
        } else {
          bar4.className = 'h-1 rounded-full bg-surface-bright transition-all duration-300';
          entropyLabel.textContent = val.length >= 8 ? 'HIGH (78%)' : 'MODERATE (52%)';
        }
      });
    }
  })();
</script></main><footer class="fixed bottom-0 w-full z-40 pb-safe bg-surface/90 backdrop-blur-xl"><div class="h-10 px-4 flex items-center justify-center gap-2 text-center"><span class="w-1.5 h-1.5 rounded-full bg-primary"></span><span class="font-mono text-[10px] tracking-wider uppercase text-on-surface-variant">BB-ALPHA-09 • V4.22.0</span></div></footer></body></html>
